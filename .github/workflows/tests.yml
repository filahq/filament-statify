name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12']
        filament: ['4', '5']
        sanctum: [true]
        include:
          - php: '8.2'
            laravel: '12'
            filament: '4'
            sanctum: false
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }} / Sanctum ${{ matrix.sanctum }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Remove optional Sanctum test dependency
        if: ${{ !matrix.sanctum }}
        run: composer remove --dev laravel/sanctum --no-update --no-interaction
      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          FILAMENT: ${{ matrix.filament }}
        run: |
          TESTBENCH=$((LARAVEL - 2))
          OPTIONS=()
          # Exercise legacy Laravel 11 compatibility in this isolated runner only.
          # Its known framework advisories otherwise block dependency resolution.
          if [ "$LARAVEL" = "11" ]; then
            OPTIONS+=(--no-security-blocking)
          fi
          composer update --with="laravel/framework:^${LARAVEL}.0" --with="orchestra/testbench:^${TESTBENCH}.0" --with="filament/widgets:^${FILAMENT}.0" --prefer-dist --no-interaction --no-progress "${OPTIONS[@]}"
      - name: Verify widgets-only install
        run: |
          php -r "require 'vendor/autoload.php'; exit(class_exists('Filament\\Panel') ? 1 : 0);"
      - name: Verify Sanctum is absent
        if: ${{ !matrix.sanctum }}
        run: |
          php -r "require 'vendor/autoload.php'; exit(class_exists('Laravel\\Sanctum\\Sanctum') ? 1 : 0);"
      - run: composer validate --strict
      - run: composer test
      - run: composer lint
